<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Simulados</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/questoes.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Gerador de Simulados</h1>
        <p>Teste seus conhecimentos</p>
      </header>

      <form class="">
        <label for="selDisciplina">Disciplina</label>
        <select name="disciplina" id="selDisciplina" required>
          <option value="" disabled selected>Selecione uma disciplina</option>
          <option value="Português">Português</option>
          <option value="Matemática">Matemática</option>
          <option value="Inglês">Inglês</option>
          <option value="Raciocínio Lógico">Raciocínio Lógico</option>
          <option value="História">História</option>
          <option value="Geografia">Geografia</option>
        </select>

        <label for="numQuestoes">Quantidade de Questões</label>
        <input
          type="number"
          min="1"
          max="20"
          id="numQuestoes"
          name="numQuestoes"
          required
        />

        <button type="submit" id="iniciarSimuladoBtn">Iniciar Simulado</button>
      </form>

      <section id="simulado" class="oculto">
        <p id="outDisciplina"></p>
        <p>Questão <span id="spnCont"></span> de <span id="spnTot"></span></p>
        <!--Dentro do span será alterado conforme o número de questoes escolhidas-->
        <fieldset id="questao">
          <p id="enunciadoQuestao"></p>
          <!--Aqui  serão as questoes geradas pelo js-->
          <ul id="alternativasContainer"></ul>
        </fieldset>

        <button type="button" id="proxBtn">Próxima</button>
      </section>

      <section id="fimSimulado" class="oculto" aria-live="polite">
        <h2>Simulado Concluído!</h2>
        <p>
          Você acertou <span id="numAcertosFim"></span> de
          <span id="totQuestoesFim"></span> questões
        </p>
        <button type="button" id="novoSimulado">Fazer novo Simulado</button>
      </section>
    </main>
    <script src="./js/questions.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
